openapi: 3.2.0
info:
  title: Meilisearch Keys API
  description: 'Meilisearch is an open-source, lightning-fast search engine API. This specification

    documents the core REST endpoints for managing indexes, documents, search, settings,

    API keys, and tasks. All protected routes require Bearer token authentication using

    a master key or regular API key.'
  version: '1.0'
  contact:
    name: Meilisearch
    url: https://www.meilisearch.com/docs
servers:
- url: http://localhost:7700
  description: Default local Meilisearch instance
- url: https://{cluster}.meilisearch.io
  description: Meilisearch Cloud instance
  variables:
    cluster:
      default: edge
security:
- bearerAuth: []
tags:
- name: Keys
paths:
  /keys:
    get:
      tags:
      - Keys
      summary: List API keys
      responses:
        '200':
          description: Paginated keys
      operationId: getKeys
      x-operation-id-source: derived
    post:
      tags:
      - Keys
      summary: Create API key
      responses:
        '201':
          description: Created key
      operationId: postKeys
      x-operation-id-source: derived
  /keys/{keyOrUid}:
    parameters:
    - name: keyOrUid
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Keys
      summary: Get an API key
      responses:
        '200':
          description: Key
      operationId: getKeysByKeyOrUid
      x-operation-id-source: derived
    patch:
      tags:
      - Keys
      summary: Update an API key
      responses:
        '200':
          description: Updated key
      operationId: patchKeysByKeyOrUid
      x-operation-id-source: derived
    delete:
      tags:
      - Keys
      summary: Delete an API key
      responses:
        '204':
          description: Deleted
      operationId: deleteKeysByKeyOrUid
      x-operation-id-source: derived
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: 'Authorization header using "Authorization: Bearer {API_KEY}".

        The master key authorizes /keys management; regular API keys

        should be used for all other routes.

        '
